<meta charset="UTF-8" />
<title>This Week — Bounce Loop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: auto;
  }
  .page-pad {
    min-width: 100%;
    min-height: 100%;
    padding: 64px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Fixed 6:4 landscape stage. Position and color are both driven by
     one requestAnimationFrame loop (see script) rather than CSS @keyframes,
     so the loop stays exact even under aggressive browser throttling.
     Bounce: Tx=6s horizontal round trip, Ty=4s vertical round trip
     (LCM=12s). Color: 24s crossfade cycle, 8 evenly-spaced stops of 3s
     each. Full perfect loop = LCM(12s, 24s) = 24s. A fixed margin keeps
     the logo from ever touching the stage edge (see MARGIN in script). */
  .stage {
    position: relative;
    width: 1500px;
    height: 1000px;
    overflow: hidden;
    outline: 1px solid rgba(255, 255, 255, 0.08);
    outline-offset: -1px;
  }

  .bg {
    position: absolute;
    inset: 0;
    background: #000000;
  }

  .bounce {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
  }

<body>
<div class="page-pad">
  <div class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="bounce" id="bounce">
      <div class="logo-mask" id="logo"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  var bg = document.getElementById('bg');
  var bounce = document.getElementById('bounce');
  var logo = document.getElementById('logo');

  var STAGE_W = 1500, STAGE_H = 1000;
  var LOGO_W = 480, LOGO_H = 345;
  var MARGIN = 40; // keeps the logo clear of the stage edge at all times
  var DIST_X = STAGE_W - LOGO_W - 2 * MARGIN;
  var DIST_Y = STAGE_H - LOGO_H - 2 * MARGIN;

  var TX = 6;   // seconds per horizontal round trip (halved speed from before)
  var TY = 4;   // seconds per vertical round trip (LCM(TX,TY) = 12s bounce loop)
  var CYCLE = 24; // color-cycle length in seconds (much slower crossfades);
                  // LCM(12s bounce, 24s color) = 24s for the full perfect loop

  // Solid color crossfade, ping-ponged so the cycle ends exactly where it
  // started (no jump cut): white -> black -> white -> blue -> black
  // -> blue -> white -> black -> white. Background runs the same pattern
  // with white/black swapped, so it's never the same color as the logo
  // at rest points.
  var WHITE = [255, 255, 255];
  var BLACK = [0, 0, 0];
  var BLUE = [0x24, 0x54, 0xff];

  var LOGO_STOPS = [WHITE, BLACK, WHITE, BLUE, BLACK, BLUE, WHITE, BLACK, WHITE];
  var BG_STOPS = [BLACK, WHITE, BLACK, BLUE, WHITE, BLUE, BLACK, WHITE, BLACK];
  var SEGMENT = CYCLE / (LOGO_STOPS.length - 1); // 0.75s per stop

  function triangle(t, period, dist) {
    var p = (((t % period) + period) % period) / period; // 0..1
    return p < 0.5 ? dist * (p * 2) : dist * (2 - p * 2);
  }

  function colorAt(t, stops) {
    var pos = (((t % CYCLE) + CYCLE) % CYCLE) / SEGMENT; // 0..8
    var i = Math.floor(pos);
    var f = pos - i;
    var c1 = stops[i], c2 = stops[i + 1];
    var r = Math.round(c1[0] + (c2[0] - c1[0]) * f);
    var g = Math.round(c1[1] + (c2[1] - c1[1]) * f);
    var b = Math.round(c1[2] + (c2[2] - c1[2]) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var start = null;
  function frame(now) {
    if (start === null) start = now;
    var t = (now - start) / 1000;

    var x = MARGIN + triangle(t, TX, DIST_X);
    var y = MARGIN + triangle(t, TY, DIST_Y);
    bounce.style.transform = 'translate(' + x + 'px,' + y + 'px)';

    logo.style.backgroundColor = colorAt(t, LOGO_STOPS);
    bg.style.backgroundColor = colorAt(t, BG_STOPS);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
