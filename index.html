<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Everything below (favicon, apple-touch-icon, app title, manifest,
         OG tags) is one static GlowUp identity now, no per-route JS
         swapping — the portfolio is gated behind a "visit GlowUp"
         placeholder (see PortfolioGate.jsx) and GlowUp itself is moving to
         its own deployment, so there's no separate portfolio identity left
         to protect here. Revert / re-split if the portfolio comes back
         before that move happens. -->
    <link rel="icon" type="image/png" href="/glowup-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C93500" />
    <!-- theme-color above only affects the in-Safari-tab chrome;
         status-bar-style is the separate tag iOS uses once added to the
         home screen. "default" keeps the bar light/non-overlaying, matching
         the mostly-white signed-in app without needing safe-area-inset
         handling for a translucent bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Glow Up" />
    <meta name="description" content="Your skincare routine, organized. Track products, treatments, and your routine — all in one place." />
    <meta property="og:title" content="Glow Up" />
    <meta property="og:description" content="Your skincare routine, organized. Track products, treatments, and your routine — all in one place." />
    <meta property="og:url" content="https://www.melanie.studio" />
    <link rel="apple-touch-icon" href="/glowup-apple-touch-icon.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/glowup-apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest-glowup.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Glow Up</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
