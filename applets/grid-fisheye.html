<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fisheye Grid</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    display: block;
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const GRID_SIZE = 20;        // pixel grid spacing
  const LINE_WIDTH = 2;        // line weight
  const GRID_COLOR = '#2454ff';
  const BG_COLOR = '#000000';

  const RADIUS = 220;          // fisheye influence radius
  const STRENGTH = 0.3;        // 0-1, higher = stronger bulge
  const EDGE_SOFTNESS = 0.5;   // 0-1, fraction of RADIUS where the fade-out begins (lower = softer/wider edge)
  const EASE = 0.18;           // cursor-follow smoothing (1 = instant)
  const SAMPLE_STEP = 6;       // px between sample points along each line (finer = smoother curves, costs perf)

  let dpr = Math.max(window.devicePixelRatio || 1, 1);
  let width, height;

  // Actual pointer position (target) and eased position (what the warp follows)
  let targetX = -9999, targetY = -9999;
  let curX = -9999, curY = -9999;
  let hasPointer = false;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
    hasPointer = true;
  });

  window.addEventListener('mouseleave', () => {
    hasPointer = false;
  });

  function smoothstep(edge0, edge1, x) {
    const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  // Fisheye/bulge displacement of a single point relative to the warp center
  function warp(x, y, cx, cy) {
    const dx = x - cx;
    const dy = y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist === 0 || dist >= RADIUS) return [x, y];

    const norm = dist / RADIUS;
    const newNorm = Math.pow(norm, 1 - STRENGTH);
    const scale = (newNorm * RADIUS) / dist;

    const bulgedX = cx + dx * scale;
    const bulgedY = cy + dy * scale;

    // Fade the displacement smoothly to zero as it nears RADIUS, so there's
    // no hard ring where the warped grid meets the flat grid.
    const fade = 1 - smoothstep(RADIUS * EDGE_SOFTNESS, RADIUS, dist);

    return [x + (bulgedX - x) * fade, y + (bulgedY - y) * fade];
  }

  function drawLine(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.stroke();
  }

  function frame() {
    // Ease the warp center toward the real cursor position
    curX += (targetX - curX) * EASE;
    curY += (targetY - curY) * EASE;

    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = LINE_WIDTH;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const activeRadius = hasPointer || targetX > -9000 ? RADIUS : 0;

    // Vertical lines
    for (let x = 0; x <= width; x += GRID_SIZE) {
      const near = Math.abs(x - curX) < activeRadius + GRID_SIZE;
      if (!near) {
        drawLine([[x, 0], [x, height]]);
        continue;
      }
      const pts = [];
      for (let y = 0; y <= height; y += SAMPLE_STEP) {
        pts.push(warp(x, y, curX, curY));
      }
      pts.push(warp(x, height, curX, curY));
      drawLine(pts);
    }

    // Horizontal lines
    for (let y = 0; y <= height; y += GRID_SIZE) {
      const near = Math.abs(y - curY) < activeRadius + GRID_SIZE;
      if (!near) {
        drawLine([[0, y], [width, y]]);
        continue;
      }
      const pts = [];
      for (let x = 0; x <= width; x += SAMPLE_STEP) {
        pts.push(warp(x, y, curX, curY));
      }
      pts.push(warp(width, y, curX, curY));
      drawLine(pts);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
