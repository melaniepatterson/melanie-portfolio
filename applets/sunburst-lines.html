<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sunburst Lines</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #2454FF;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const BG = '#2454FF';
  const LINE_COLOR = '#FFFFFF';
  const LINE_WIDTH = 1;

  const LINES_PER_SIDE = 18;
  const MAX_ANGLE_DEG = 74;      // sweep from vertical, for the regular fan
  const EDGE_BLADES = 2;         // how many outermost blades get pushed further
  const EDGE_MAX_ANGLE_DEG = 87; // how far the edge blades swing (close to 90 = falls off the bottom)
  const PIVOT_Y_OFFSET = 0.06;   // fraction of canvas height the pivot sits below the bottom edge
  const LEFT_PIVOT_X = -0.08;    // fraction of canvas width (negative = off the left edge)
  const RIGHT_PIVOT_X = 1.08;    // fraction of canvas width (>1 = off the right edge)

  const FALL_STAGGER = 70;       // ms between each line starting to fall
  const FALL_DURATION = 650;     // ms for a single line to fall
  const HOLD_DURATION = 1100;    // ms fully fanned out
  const RISE_STAGGER = 70;
  const RISE_DURATION = 550;
  const REST_DURATION = 500;     // ms fully upright before looping again

  let W, H, DPR;
  let leftPivot, rightPivot, lineLength;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    leftPivot = { x: W * LEFT_PIVOT_X, y: H * (1 + PIVOT_Y_OFFSET) };
    rightPivot = { x: W * RIGHT_PIVOT_X, y: H * (1 + PIVOT_Y_OFFSET) };
    lineLength = Math.hypot(W, H) * 1.4;
  }
  window.addEventListener('resize', resize);
  resize();

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInCubic(t) { return t * t * t; }
  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }

  const totalFallTime = (LINES_PER_SIDE - 1) * FALL_STAGGER + FALL_DURATION;
  const totalRiseTime = (LINES_PER_SIDE - 1) * RISE_STAGGER + RISE_DURATION;
  const fallEnd = totalFallTime;
  const holdEnd = fallEnd + HOLD_DURATION;
  const riseEnd = holdEnd + totalRiseTime;
  const cycleLength = riseEnd + REST_DURATION;

  // angle of line i (0 = innermost/first to fall) at its fully-fallen state, in radians
  function targetAngle(i) {
    const normalCount = LINES_PER_SIDE - EDGE_BLADES;
    const normalMax = MAX_ANGLE_DEG * Math.PI / 180;

    if (i < normalCount) {
      const step = normalMax / (normalCount - 1);
      return i * step;
    }

    // the last few blades break away from the regular fan and swing further down
    const edgeMax = EDGE_MAX_ANGLE_DEG * Math.PI / 180;
    const edgeIndex = i - (normalCount - 1); // 1..EDGE_BLADES
    const t = edgeIndex / EDGE_BLADES;
    return normalMax + t * (edgeMax - normalMax);
  }

  function lineAngle(i, t) {
    const target = targetAngle(i);

    if (t <= fallEnd) {
      const start = i * FALL_STAGGER;
      const p = clamp01((t - start) / FALL_DURATION);
      return target * easeOutCubic(p);
    }
    if (t <= holdEnd) {
      return target;
    }
    if (t <= riseEnd) {
      // reverse order: the last line to fall is the first to rise
      const riseIndex = (LINES_PER_SIDE - 1) - i;
      const start = holdEnd + riseIndex * RISE_STAGGER;
      const p = clamp01((t - start) / RISE_DURATION);
      return target * (1 - easeInCubic(p));
    }
    return 0;
  }

  function drawLine(pivot, angle, direction) {
    // angle measured from vertical (upright); direction: -1 falls left, +1 falls right
    const theta = -Math.PI / 2 + direction * angle; // start pointing straight up
    const x2 = pivot.x + Math.cos(theta) * lineLength;
    const y2 = pivot.y + Math.sin(theta) * lineLength;
    ctx.beginPath();
    ctx.moveTo(pivot.x, pivot.y);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function render(t) {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = LINE_COLOR;
    ctx.lineWidth = LINE_WIDTH;

    for (let i = 0; i < LINES_PER_SIDE; i++) {
      const angle = lineAngle(i, t);
      drawLine(leftPivot, angle, +1);  // left side falls to the right
      drawLine(rightPivot, angle, -1); // right side falls to the left
    }
  }

  let startTime = null;
  function frame(now) {
    if (startTime === null) startTime = now;
    const elapsed = (now - startTime) % cycleLength;
    render(elapsed);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
